# Fork only: builds the image with the local fixes and publishes it as
# ghcr.io/joostme/bambuddy:sha-<commit>. Upstream publishes via docker-publish.sh.
name: Fork image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.repository == 'joostme/bambuddy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/joostme/bambuddy:sha-${{ steps.sha.outputs.short }}
          labels: org.opencontainers.image.source=https://github.com/joostme/bambuddy
          cache-from: type=gha
          cache-to: type=gha,mode=max
